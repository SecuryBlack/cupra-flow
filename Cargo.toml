[package]
name = "cupraflow"
version = "0.3.0"
edition = "2021"
authors = ["CupraFlow Team"]
description = "SecuryBlack traffic agent: owns the server's Caddy and its routes"
license = "Apache-2.0"
repository = "https://github.com/securyblack/cupra-flow"

[dependencies]
sb-agent-core = { git = "https://github.com/securyblack/sb-agent-core", tag = "v0.4.3" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util", "net", "fs"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ya en el árbol vía sb-agent-core (self_update): no añade crates nuevos.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[[bin]]
name = "cupraflow"
path = "src/main.rs"
